; Desk Buddy — SpotPear/Waveshare ESP32-S3-LCD-1.3 (prism)
; ESP32-S3R8, 16MB flash, 8MB octal PSRAM, ST7789 240x240, CH343 USB-serial

[platformio]
default_envs = buddy

[env:buddy]
; pinned to the versions every check so far was built with (docs/HISTORY.md): espressif32 8.0.0 brings
; Arduino core 3.3.12; a newer one is tried on purpose, built and checked again, never picked up by chance
platform = espressif32 @ 8.0.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions_sage.csv
monitor_speed = 115200
; -O2: drawing instruction frames is the busiest thing it does. BOARD_HAS_PSRAM: its work buffers live there.
build_unflags = -Os
build_flags = -O2 -DBOARD_HAS_PSRAM
lib_deps =
    lovyan03/LovyanGFX @ 1.3.0
; Sage's drawings (data/sage.bin) are not built in: they live in the "sage" partition,
; written by tools/flash.sh (cable) or tools/ota.py --art (Wi-Fi).

; The board's firmware for Espressif's QEMU (tools/qemu/README.md): the same build, with each screen also copied into
; QEMU's virtual panel by wrapping LovyanGFX's pushImage at link time (qemu/qemu_panel.cpp). Never flashed.
[env:qemu]
extends = env:buddy
build_flags = ${env:buddy.build_flags} -Wl,--wrap=_ZN4lgfx2v18LGFXBase9pushImageEllllPNS0_11pixelcopy_tEb
build_src_filter = +<*> +<../qemu/>
